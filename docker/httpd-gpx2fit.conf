# gpx2fit static web hosting snippet for httpd:alpine.
# Included from /usr/local/apache2/conf/httpd.conf by the Docker image.

# Serve WebAssembly with the correct media type.
AddType application/wasm .wasm

# Security / caching headers for the static bundle.
<IfModule mod_headers.c>
    Header set X-Content-Type-Options "nosniff"

    # Generated/static assets can be cached briefly; the service worker handles
    # app-shell updates.
    <FilesMatch "\.(wasm|js|css)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    # HTML shell, service worker and version manifest must always be checked so
    # the web app's update detector sees new deployments immediately. This comes
    # after the asset rule so sw.js is not caught by the generic .js rule.
    <FilesMatch "^(index\.html|sw\.js|version\.json)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</IfModule>

# Trust X-Forwarded-For from private reverse proxies / load balancers.
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1/8
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy ::1
    RemoteIPInternalProxy fd00::/8
    RemoteIPInternalProxy fe80::/10
</IfModule>

# Record the client IP resolved by mod_remoteip and the original protocol.
# %a uses the client IP (mod_remoteip replaces it with X-Forwarded-For).
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" proto=%{X-Forwarded-Proto}i" gpx2fit_forwarded
CustomLog /proc/self/fd/1 gpx2fit_forwarded
ErrorLog /proc/self/fd/2
