name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'data/**'
      - 'web/**'
      - 'Makefile'
      # These affect the generated bundle too, so changes here must redeploy.
      - 'tools/expat_port.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise deployments and never cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GITHUB_TOKEN cannot create a Pages site (that needs an admin PAT), so
      # fail early with instructions instead of a cryptic 404 from configure-pages.
      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! site=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null); then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Enable it once in Settings > Pages > Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
          if [ "$(printf '%s' "$site" | jq -r '.build_type')" != "workflow" ]; then
            echo "::error::GitHub Pages source must be 'GitHub Actions'. Change it in Settings > Pages, then re-run this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev xxd

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build WebAssembly bundle
        run: make wasm

      - name: Test wasm converter and web app
        run: |
          node tests/test_wasm.mjs
          node tests/test_web.mjs

      # Rewrites web/version.json, web/sw.js and web/index.html with one
      # build id; run after make wasm and before packaging the artifact.
      - name: Stamp web build version
        run: make web-version

      - name: Verify web bundle
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/style.css
          test -s web/sw.js
          test -s web/version.json
          test -s web/caltopo_sample.gpx
          test -s web/dist/gpx2fit.js
          test -s web/dist/gpx2fit.wasm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
