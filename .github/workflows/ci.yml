name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev cppcheck xxd libxml2-utils

      - name: Build
        run: make

      - name: Unit and shell tests
        run: make test

      - name: Sanitizer tests
        run: make test-asan

      - name: Static analysis (cppcheck)
        run: cppcheck --std=c11 -Isrc --suppress=missingIncludeSystem --enable=warning --error-exitcode=1 src/

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WebAssembly build and tests
        run: make wasm && node tests/test_wasm.mjs
