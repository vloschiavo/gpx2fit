name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/vloschiavo/gpx2fit
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Prepare web build metadata
        id: web-build
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: |
          set -euo pipefail
          build_time=$(date -u -d "$COMMIT_TIMESTAMP" +%Y%m%dT%H%M%SZ)
          build_id="${COMMIT_SHA:0:12}-$build_time"
          {
            echo "sha=$COMMIT_SHA"
            echo "build_time=$build_time"
            echo "build_id=$build_id"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WEB_BUILD_ID=${{ steps.web-build.outputs.build_id }}
            WEB_SHA=${{ steps.web-build.outputs.sha }}
            WEB_BUILD_TIME=${{ steps.web-build.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
